<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#20231f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Taskroom</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark" aria-label="Taskroom home"><span></span></div>
      <div class="side-meta"><span class="eyebrow">Workspace</span><strong>Taskroom</strong></div>
      <div class="side-bottom"><span class="status-dot"></span><span>Supabase workspace</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="mobile-brand"><div class="brand-mark"><span></span></div><strong>Taskroom</strong></div>
        <nav class="main-nav" aria-label="Primary navigation">
          <button class="nav-link active" data-view="items">Items</button>
          <span id="task-count" hidden>0</span>
          <div class="nav-task-summary"><span><strong id="open-count">0</strong> open</span><span><strong id="done-count">0</strong> complete</span></div>
        </nav>
        <div class="account-actions">
          <span id="sync-status" class="sync-status">Connecting…</span>
          <span id="user-email" class="user-email" hidden></span>
          <button id="sign-out-button" class="account-button" type="button" hidden>Sign out</button>
          <span id="app-version" class="app-version"></span>
          <button class="icon-button" id="clear-data" title="Clear all Taskroom data" aria-label="Clear all Taskroom data">↗</button>
        </div>
      </header>

      <section id="items-view" class="view active-view">
        <div class="task-layout">
          <div class="task-list-panel">
            <div class="list-toolbar">
              <button class="new-item-plus" id="new-task-button" aria-label="New item" title="New item">＋</button>
              <label class="category-filter" for="category-filter"><span class="visually-hidden">Category</span><select id="category-filter" aria-label="Category"><option value="all">All</option></select></label>
            </div>
            <div id="task-list" class="task-list"></div>
            <div id="item-notes-panel" class="item-detail-panel"></div>
            <div id="item-tasks-panel" class="item-tasks-panel"></div>
            <div id="log-content" class="item-detail-panel"></div>
            <div id="docs-content" class="item-detail-panel"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="auth-dialog" class="auth-dialog">
    <form id="auth-form">
      <p class="eyebrow">Private access</p>
      <h2>Sign in to Taskroom</h2>
      <p>Your items, tasks, logs, and documents are private to your Supabase account.</p>
      <label>Email<input id="auth-email" type="email" autocomplete="email" required /></label>
      <label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required /></label>
      <p id="auth-message" class="auth-message" role="alert"></p>
      <div class="auth-actions"><button id="sign-up-button" class="text-button" type="button">Create account</button><button id="sign-in-button" class="primary-button" type="submit">Sign in</button></div>
    </form>
  </dialog>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
